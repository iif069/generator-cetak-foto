<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Susun Foto R ke A4</title>
<style>
:root{--bg:#e9e8e4;--panel:#fff;--ink:#1b1b1a;--mute:#6b6a66;--line:#d6d4cd;--acc:#1f5eff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1b;--panel:#2a2a28;--ink:#f0efea;--mute:#a09e97;--line:#43423e;--acc:#6f9bff}}
:root[data-theme="dark"]{--bg:#1c1c1b;--panel:#2a2a28;--ink:#f0efea;--mute:#a09e97;--line:#43423e;--acc:#6f9bff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
h1{font-size:19px;margin:0}
p.s{margin:0;color:var(--mute);font-size:13px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:var(--mute);font-size:14px}
.drop:hover,.drop.on{border-color:var(--acc);color:var(--acc)}
button{font:inherit;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.info{font-size:13px;background:var(--bg);border-radius:6px;padding:10px}
main{padding:24px;overflow:auto}
#pages{zoom:.62;display:flex;flex-direction:column;align-items:center;gap:24px}
.page{position:relative;width:210mm;height:297mm;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);flex:none}
.cell{position:absolute;overflow:hidden;background:#f1f0ec}
.cell img{width:100%;height:100%;display:block}
.page svg{position:absolute;inset:0;width:210mm;height:297mm}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}#pages{zoom:.4}}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}.app{display:block}aside{display:none}main{padding:0;overflow:visible}
 #pages{zoom:1;display:block}
 .page{box-shadow:none;break-after:page;page-break-after:always}
 .page:last-child{break-after:auto;page-break-after:auto}
 .cell{background:none}.cell.empty{display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <div><h1>Susun Foto R ke A4</h1><p class="s">Foto otomatis memenuhi lembar A4, siap cetak.</p></div>
 <div class="drop" id="drop" tabindex="0" role="button">Klik atau tarik foto ke sini<br><span style="font-size:12px">bisa banyak sekaligus</span></div>
 <input id="file" type="file" accept="image/*" multiple hidden>
 <label>Ukuran foto
  <select id="size">
   <option value="1R">1R (5 × 7,5 cm)</option>
   <option value="2R">2R (6 × 9 cm)</option>
   <option value="3R">3R (8,9 × 12,7 cm)</option>
   <option value="4R">4R (10,2 × 15,2 cm)</option>
   <option value="5R">5R (12,7 × 17,8 cm)</option>
   <option value="6R">6R (15,2 × 20,3 cm)</option>
   <option value="P23">Pas foto 2 × 3 cm</option>
   <option value="P34">Pas foto 3 × 4 cm</option>
   <option value="P46">Pas foto 4 × 6 cm</option>
  </select></label>
 <label>Salinan per foto
  <select id="copies"><option value="0">Penuhi 1 lembar</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="6">6</option><option value="8">8</option></select></label>
 <label>Isi foto
  <select id="fit"><option value="cover">Penuh (bagian lebih dipotong)</option><option value="contain">Utuh (ada sisi putih)</option></select></label>
 <label>Jarak antar foto (mm)<input id="gap" type="number" min="0" max="20" step="0.5" value="0"></label>
 <label class="chk"><input id="rot" type="checkbox" checked> Putar foto otomatis mengikuti bingkai</label>
 <div class="info" id="info"></div>
 <button id="print">Cetak / Simpan PDF</button>
 <button class="g" id="clear">Hapus semua foto</button>
</aside>
<main><div id="pages"></div></main>
</div>
<script>
const SIZES={'1R':[50,75],'2R':[60,90],'3R':[89,127],'4R':[102,152],'5R':[127,178],'6R':[152,203],'P23':[20,30],'P34':[30,40],'P46':[40,60]};
const M=3,UW=210-2*M,UH=297-2*M;
const $=id=>document.getElementById(id);
let photos=[];

function layout(w,h,g){
  const f=(a,b)=>({cw:a,ch:b,cols:Math.max(0,Math.floor((UW+g)/(a+g))),rows:Math.max(0,Math.floor((UH+g)/(b+g)))});
  const p=f(w,h),l=f(h,w);
  return (l.cols*l.rows>p.cols*p.rows)?l:p;
}
function cellImage(img,cw,ch){
  const pw=Math.round(cw/25.4*300),ph=Math.round(ch/25.4*300);
  const sw=img.naturalWidth,sh=img.naturalHeight;
  const rot=$('rot').checked&&((sw>sh)!==(cw>ch));
  const c=document.createElement('canvas');c.width=pw;c.height=ph;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pw,ph);
  const tw=rot?ph:pw,th=rot?pw:ph;
  const s=($('fit').value==='cover'?Math.max:Math.min)(tw/sw,th/sh);
  x.translate(pw/2,ph/2);if(rot)x.rotate(Math.PI/2);
  x.drawImage(img,-sw*s/2,-sh*s/2,sw*s,sh*s);
  return c.toDataURL('image/jpeg',.92);
}
function render(){
  const [w,h]=SIZES[$('size').value],g=Math.max(0,parseFloat($('gap').value)||0);
  const L=layout(w,h,g),per=L.cols*L.rows,root=$('pages');
  root.innerHTML='';
  if(!per){$('info').textContent='Ukuran terlalu besar untuk A4 dengan margin 3 mm.';return}
  const n=+$('copies').value||per;
  let seq=[];
  photos.forEach((p,i)=>{ // tiap foto mulai di halaman baru bila "penuhi lembar"
    const src=cellImage(p,L.cw,L.ch);
    for(let k=0;k<n;k++)seq.push(src);
    if(!+$('copies').value===false&&false){}
  });
  const pages=Math.max(1,Math.ceil(seq.length/per));
  const gw=L.cols*L.cw+(L.cols-1)*g,gh=L.rows*L.ch+(L.rows-1)*g;
  const ox=M+(UW-gw)/2,oy=M+(UH-gh)/2;
  for(let pg=0;pg<pages;pg++){
    const page=document.createElement('div');page.className='page';
    let rects='';
    for(let r=0;r<L.rows;r++)for(let c=0;c<L.cols;c++){
      const x=ox+c*(L.cw+g),y=oy+r*(L.ch+g),src=seq[pg*per+r*L.cols+c];
      if(src){
        const d=document.createElement('div');d.className='cell';
        d.style.cssText=`left:${x}mm;top:${y}mm;width:${L.cw}mm;height:${L.ch}mm`;
        d.innerHTML=`<img src="${src}" alt="">`;page.appendChild(d);
        rects+=`<rect x="${x}" y="${y}" width="${L.cw}" height="${L.ch}"/>`;
      }else{
        const d=document.createElement('div');d.className='cell empty';
        d.style.cssText=`left:${x}mm;top:${y}mm;width:${L.cw}mm;height:${L.ch}mm`;page.appendChild(d);
      }
    }
    page.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#000" stroke-width="0.1">${rects}</g></svg>`);
    root.appendChild(page);
  }
  $('info').innerHTML=`<b>${per} foto</b> per lembar (${L.cols} × ${L.rows}${L.cw!==w?', dirotasi':''})<br>${photos.length} foto → ${photos.length?pages:0} lembar A4<br>Margin 3 mm, garis potong 0,1 mm`;
}
function addFiles(files){
  const jobs=[...files].filter(f=>f.type.startsWith('image/')).map(f=>new Promise(res=>{
    const im=new Image();im.onload=()=>{photos.push(im);res()};im.onerror=res;im.src=URL.createObjectURL(f);
  }));
  Promise.all(jobs).then(render);
}
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};
$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');addFiles(e.dataTransfer.files)};
['size','copies','fit','gap','rot'].forEach(id=>$(id).addEventListener('input',render));
$('clear').onclick=()=>{photos=[];render()};
$('print').onclick=()=>window.print();
render();
</script>
</body>
</html>
