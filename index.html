<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Susun Foto R ke A4</title>
<style>
:root{--bg:#e9e8e4;--panel:#fff;--ink:#1b1b1a;--mute:#6b6a66;--line:#d6d4cd;--acc:#1f5eff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1b;--panel:#2a2a28;--ink:#f0efea;--mute:#a09e97;--line:#43423e;--acc:#6f9bff}}
:root[data-theme="dark"]{--bg:#1c1c1b;--panel:#2a2a28;--ink:#f0efea;--mute:#a09e97;--line:#43423e;--acc:#6f9bff}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:16px}
h1{font-size:19px;margin:0}
p.s{margin:0;color:var(--mute);font-size:13px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:18px;text-align:center;cursor:pointer;color:var(--mute);font-size:14px}
.drop:hover,.drop.on{border-color:var(--acc);color:var(--acc)}
button{font:inherit;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;background:var(--acc);color:#fff;font-weight:600}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:400}
button:focus-visible,select:focus-visible,input:focus-visible,.drop:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.info{font-size:13px;background:var(--bg);border-radius:6px;padding:10px}
main{padding:24px;overflow:auto}
#pages{zoom:.62;display:flex;flex-direction:column;align-items:center;gap:24px}
.page{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.18);flex:none}
.cell{position:absolute;overflow:hidden;background:#fff}
.cell img{width:100%;height:100%;display:block}
.page svg{position:absolute;inset:0;width:100%;height:100%}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.two[hidden]{display:none}label[hidden]{display:none}#plist[hidden]{display:none}
.rows{max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.prow{display:grid;grid-template-columns:36px 42px minmax(0,1fr) 32px;gap:6px;align-items:center;font-size:12px;color:var(--mute)}
.prow img{width:36px;height:36px;object-fit:cover;border-radius:4px}
.prow select{padding:5px;font-size:12px;min-width:0}
button.x{padding:4px 0}.two input{min-width:0;width:100%}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}#pages{zoom:.4}}
@media print{
 .ghost{display:none}
 body{background:#fff}.app{display:block}aside{display:none}main{padding:0;overflow:visible}
 #pages{zoom:1;display:block}
 .page{box-shadow:none;break-after:page;page-break-after:always}
 .page:last-child{break-after:auto;page-break-after:auto}
 .cell.empty{display:none}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
<aside>
 <div><h1>Susun Foto R ke A4</h1><p class="s">Foto otomatis memenuhi lembar kertas, siap cetak.</p></div>
 <div class="drop" id="drop" tabindex="0" role="button">Klik atau tarik foto ke sini<br><span style="font-size:12px">bisa banyak sekaligus</span></div>
 <input id="file" type="file" accept="image/*" multiple hidden>
 <div id="plist" hidden></div>
 <label>Kertas
  <select id="paper">
   <option value="210x297">A4 (210 × 297 mm)</option>
   <option value="297x420">A3 (297 × 420 mm)</option>
   <option value="329x483">A3+ (329 × 483 mm)</option>
   <option value="215x330">F4 (215 × 330 mm)</option>
   <option value="custom">Custom (kertas sisa)</option>
  </select></label>
 <div class="two" id="custom" hidden>
  <label>Lebar (mm)<input id="pw" type="number" min="30" step="1" value="150"></label>
  <label>Tinggi (mm)<input id="ph" type="number" min="30" step="1" value="200"></label>
 </div>
 <label>Mode
  <select id="mode">
   <option value="r">Foto ukuran R (1R, 2R, dst)</option>
   <option value="split">Bagi kertas jadi 2 atau 4</option>
  </select></label>
 <label id="lblSplit" hidden>Pembagian kertas
  <select id="split">
   <option value="2h">2 bagian (atas-bawah)</option>
   <option value="2v">2 bagian (kiri-kanan)</option>
   <option value="4">4 bagian (2 × 2)</option>
  </select></label>
 <label>Posisi susunan di kertas
  <select id="align">
   <option value="tc">Atas tengah (sisa di bawah)</option>
   <option value="tl">Atas kiri</option>
   <option value="c">Tengah</option>
  </select></label>
 <label id="lblSize">Ukuran foto
  <select id="size">
   <option value="1R">1R (5 × 7,5 cm)</option>
   <option value="2R">2R (6 × 9 cm)</option>
   <option value="3R">3R (8,9 × 12,7 cm)</option>
   <option value="4R">4R (10,2 × 15,2 cm)</option>
   <option value="5R">5R (12,7 × 17,8 cm)</option>
   <option value="6R">6R (15,2 × 20,3 cm)</option>
   <option value="P23">Pas foto 2 × 3 cm</option>
   <option value="P34">Pas foto 3 × 4 cm</option>
   <option value="P46">Pas foto 4 × 6 cm</option>
  </select></label>
 <label>Salinan per foto
  <select id="copies"><option value="0">Penuhi 1 lembar</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="6">6</option><option value="8">8</option></select></label>
 <label>Isi foto
  <select id="fit"><option value="cover">Penuh (bagian lebih dipotong)</option><option value="contain">Utuh (ada sisi putih)</option></select></label>
 <label>Border putih tiap sisi (mm)<input id="border" type="number" min="0" max="15" step="0.5" value="3"></label>
 <label>Jarak antar foto (mm)<input id="gap" type="number" min="0" max="20" step="0.5" value="0"></label>
 <label>Tebal garis potong (mm)<input id="lw" type="number" min="0.01" max="0.5" step="0.01" value="0.01"></label>
 <label class="chk"><input id="rot" type="checkbox" checked> Mode Otomatis: putar foto mengikuti bingkai</label>
 <div class="info" id="info"></div>
 <button id="print">Cetak / Simpan PDF</button>
 <button class="g" id="clear">Hapus semua foto</button>
</aside>
<main><div id="pages"></div></main>
</div>
<script>
const SIZES={'1R':[50,75],'2R':[60,90],'3R':[89,127],'4R':[102,152],'5R':[127,178],'6R':[152,203],'P23':[20,30],'P34':[30,40],'P46':[40,60]};
const M=3;let PW=210,PH=297,UW=204,UH=291;
const pgStyle=document.head.appendChild(document.createElement('style'));
const $=id=>document.getElementById(id);
let photos=[];

function pack(w,h,g){
  let best=[];
  const cnt=(a,b,W,H)=>({c:Math.max(0,Math.floor((W+g)/(a+g))),r:Math.max(0,Math.floor((H+g)/(b+g)))});
  const grid=(a,b,c,r,x0,y0)=>{const o=[];for(let i=0;i<r;i++)for(let j=0;j<c;j++)o.push([x0+j*(a+g),y0+i*(b+g),a,b]);return o};
  for(const [a,b] of [[w,h],[h,w]]){
    const m=cnt(a,b,UW,UH);
    for(let k=1;k<=m.r;k++){           // sisa ruang di bawah diisi orientasi lain
      const y0=k*(b+g),s=cnt(b,a,UW,UH-y0);
      const all=grid(a,b,m.c,k,0,0).concat(grid(b,a,s.c,s.r,0,y0));
      if(all.length>best.length)best=all;
    }
    for(let k=1;k<=m.c;k++){           // sisa ruang di kanan diisi orientasi lain
      const x0=k*(a+g),s=cnt(b,a,UW-x0,UH);
      const all=grid(a,b,k,m.r,0,0).concat(grid(b,a,s.c,s.r,x0,0));
      if(all.length>best.length)best=all;
    }
  }
  if(best.length){const x0=Math.min(...best.map(c=>c[0])),y0=Math.min(...best.map(c=>c[1]));best=best.map(c=>[c[0]-x0,c[1]-y0,c[2],c[3]])}
  return best;
}
function splitCells(g){
  const t=$('split').value,cols=t==='2h'?1:2,rows=t==='2v'?1:2;
  const cw=(UW-(cols-1)*g)/cols,ch=(UH-(rows-1)*g)/rows,o=[];
  for(let i=0;i<rows;i++)for(let j=0;j<cols;j++)o.push([j*(cw+g),i*(ch+g),cw,ch]);
  return o;
}
function cellImage(img,iw,ih){
  const pw=Math.round(iw/25.4*300),ph=Math.round(ih/25.4*300);
  const sw=img.naturalWidth,sh=img.naturalHeight;
  const m=img.rot||'auto',ang=m==='auto'?(($('rot').checked&&((sw>sh)!==(iw>ih)))?90:0):+m,rot=ang%180!==0;
  const c=document.createElement('canvas');c.width=pw;c.height=ph;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pw,ph);
  const tw=rot?ph:pw,th=rot?pw:ph;
  const s=($('fit').value==='cover'?Math.max:Math.min)(tw/sw,th/sh);
  x.translate(pw/2,ph/2);x.rotate(ang*Math.PI/180);
  x.drawImage(img,-sw*s/2,-sh*s/2,sw*s,sh*s);
  return c.toDataURL('image/jpeg',.92);
}
function getSrc(p,cw,ch,b){
  const k=cw+'x'+ch;p._c=p._c||{};
  return p._c[k]||(p._c[k]=cellImage(p,cw-2*b,ch-2*b));
}
function render(){
  const pv=$('paper').value;$('custom').hidden=pv!=='custom';
  if(pv==='custom'){PW=Math.max(30,parseFloat($('pw').value)||30);PH=Math.max(30,parseFloat($('ph').value)||30)}
  else{[PW,PH]=pv.split('x').map(Number)}
  UW=PW-2*M;UH=PH-2*M;
  pgStyle.textContent=`@page{size:${PW}mm ${PH}mm;margin:0}`;
  const mode=$('mode').value;$('lblSize').hidden=mode==='split';$('lblSplit').hidden=mode!=='split';
  const [w,h]=SIZES[$('size').value],g=Math.max(0,parseFloat($('gap').value)||0);
  const cells=mode==='split'?splitCells(g):pack(w,h,g),per=cells.length,root=$('pages');
  const mn=per?Math.min(cells[0][2],cells[0][3]):0;
  const b=Math.min(Math.max(0,parseFloat($('border').value)||0),Math.max(0,mn/2-1));
  const lw=Math.max(0.01,parseFloat($('lw').value)||0.01);
  root.innerHTML='';photos.forEach(p=>p._c={});
  if(!per){$('info').textContent='Ukuran foto terlalu besar untuk kertas ini (margin 3 mm).';return}
  const n=+$('copies').value||per;
  const seq=[];photos.forEach(p=>{for(let k=0;k<n;k++)seq.push(p)});
  const pages=Math.max(1,Math.ceil(seq.length/per));
  const mx=Math.max(...cells.map(c=>c[0]+c[2])),my=Math.max(...cells.map(c=>c[1]+c[3]));
  const al=$('align').value,ox=al==='tl'?M:M+(UW-mx)/2,oy=al==='c'?M+(UH-my)/2:M;
  for(let pg=0;pg<pages;pg++){
    const page=document.createElement('div');page.className='page';page.style.width=PW+'mm';page.style.height=PH+'mm';
    let rects='',ghost='';
    cells.forEach((c,i)=>{
      const x=ox+c[0],y=oy+c[1],p=seq[pg*per+i];
      const d=document.createElement('div');
      d.className='cell'+(p?'':' empty');
      d.style.cssText=`left:${x}mm;top:${y}mm;width:${c[2]}mm;height:${c[3]}mm;padding:${b}mm`;
      if(p){d.innerHTML=`<img src="${getSrc(p,c[2],c[3],b)}" alt="">`;rects+=`<rect x="${x}" y="${y}" width="${c[2]}" height="${c[3]}"/>`}
      if(!p&&!photos.length)ghost+=`<rect x="${x}" y="${y}" width="${c[2]}" height="${c[3]}"/>`;
      page.appendChild(d);
    });
    page.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 ${PW} ${PH}" xmlns="http://www.w3.org/2000/svg"><g fill="none" stroke="#000" stroke-width="${lw}">${rects}</g><g class="ghost" fill="none" stroke="#bbb" stroke-width="0.2">${ghost}</g></svg>`);
    root.appendChild(page);
  }
  const tegak=cells.filter(c=>c[3]>=c[2]).length;
  $('info').innerHTML=`<b>${per} foto</b> per lembar (${tegak} tegak + ${per-tegak} rebah)<br>${photos.length} foto → ${photos.length?pages:0} lembar<br>Garis potong = ${mode==='split'?(+cells[0][2].toFixed(1))+' × '+(+cells[0][3].toFixed(1))+' mm':'ukuran '+$('size').value} penuh, border putih ${b} mm<br>Kertas ${PW} × ${PH} mm, margin 3 mm, garis ${lw} mm`;
}
const OPTS='<option value="auto">Otomatis</option><option value="0">Tanpa putar</option><option value="90">Putar 90° kanan</option><option value="270">Putar 90° kiri</option><option value="180">Putar 180°</option>';
function buildList(){
  const el=$('plist');el.hidden=!photos.length;
  if(!photos.length){el.innerHTML='';return}
  el.innerHTML='<label>Orientasi semua foto<select id="allrot"><option value="">Pilih untuk semua…</option>'+OPTS+'</select></label><div class="rows"></div>';
  const rows=el.querySelector('.rows');
  photos.forEach((p,i)=>{
    const r=document.createElement('div');r.className='prow';
    r.innerHTML=`<img src="${p.src}" alt=""><span>${p.naturalWidth>=p.naturalHeight?'Rebah':'Tegak'}</span><select aria-label="Orientasi foto ${i+1}">${OPTS}</select><button class="g x" title="Hapus foto" aria-label="Hapus foto ${i+1}">✕</button>`;
    const sel=r.querySelector('select');sel.value=p.rot;
    sel.onchange=()=>{p.rot=sel.value;render()};
    r.querySelector('button').onclick=()=>{photos.splice(i,1);buildList();render()};
    rows.appendChild(r);
  });
  $('allrot').onchange=e=>{if(e.target.value==='')return;photos.forEach(p=>p.rot=e.target.value);buildList();render()};
}
function addFiles(files){
  const jobs=[...files].filter(f=>f.type.startsWith('image/')).map(f=>new Promise(res=>{
    const im=new Image();im.onload=()=>{im.rot='auto';photos.push(im);res()};im.onerror=res;im.src=URL.createObjectURL(f);
  }));
  Promise.all(jobs).then(()=>{buildList();render()});
}
$('drop').onclick=()=>$('file').click();
$('drop').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('file').click()}};
$('file').onchange=e=>{addFiles(e.target.files);e.target.value=''};
$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('on')};
$('drop').ondragleave=()=>$('drop').classList.remove('on');
$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('on');addFiles(e.dataTransfer.files)};
['paper','pw','ph','size','copies','fit','gap','rot','border','lw','align','mode','split'].forEach(id=>$(id).addEventListener('input',render));
$('clear').onclick=()=>{photos=[];buildList();render()};
$('print').onclick=()=>window.print();
render();
</script>
</body>
</html>
